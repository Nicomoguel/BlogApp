
#url, h2 in memory
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
#specifies to use the h2 driver to connect to the h2 database
spring.datasource.driver-class-name=org.h2.Driver

#specify to use the H2 dialect
spring.dpa.database-platform=org.hibernate.dialect.H2Dialect
#create the schema when we run the tests and then drop it at the end
spring.jpa.hibernate.ddl-auto=create-drop
#sql configuration
spring.jpa.properties.hibernate.show-sql=true
spring.jpa.properties.hibernate.format_sql=true